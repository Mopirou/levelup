name: Déploiement Supabase

# À chaque push sur main : migrations en attente + catalogue de quêtes, puis Edge Functions.
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   SUPABASE_DB_URL        chaîne de connexion Postgres du projet (Settings → Database)
#   SUPABASE_ACCESS_TOKEN  jeton d'accès Supabase (facultatif : sans lui, seules les migrations sont jouées)
#   SUPABASE_PROJECT_REF   référence du projet (facultatif, avec le jeton)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations et catalogue (seulement si la base a du retard)
        run: npm run migrate -- --require
      - name: Edge Functions
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: npx supabase functions deploy game account push --project-ref "$SUPABASE_PROJECT_REF"
